# conf/sample.conf — ローカル動作確認用サンプル設定
#
# 使い方:
#   ./zig-out/bin/ntripcaster -c conf/sample.conf
#   tools/relay-from-upstream.sh   # 別ターミナルで上流から RTCM3 をリレー
#   http://127.0.0.1:18080/        # ブラウザで管理 UI

# ── ネットワーク ──────────────────────────────────────────────
port 12101
server_name localhost
location demo
rp_email noreply@example.com

# ── 接続上限 ──────────────────────────────────────────────────
max_clients 20
max_clients_per_source 20
max_sources 8

# ── 認証 ──────────────────────────────────────────────────────
# tools/relay-from-upstream.sh はこのパスワードで SOURCE 接続する
encoder_password localpass

# ── ログ ──────────────────────────────────────────────────────
logdir logs
logfile ntripcaster.log

# ── Sourcetable CAS/NET (自動生成) ────────────────────────────
# CAS;<host>;<port>;<identifier>;<operator>;<nmea>;<country>;<lat>;<lon>;<fb_host>;<fb_port>;<misc>
# 省略時のデフォルト: host=server_name, port=port, identifier="NtripCaster", 他は空。
caster_identifier  NtripCaster (demo)
caster_operator    yasunorioi
caster_country     JPN
caster_latitude    43.0686
caster_longitude   141.3506
# caster_nmea 0
# caster_fallback_host other.caster.example.com
# caster_fallback_port 2101
# caster_misc free

# NET 行は network_identifier が空でなければ自動で追記される
# network_identifier MyNet
# network_operator   MyOrg
# network_auth       N
# network_fee        N
# network_web_net    https://example.com/net
# network_web_str    https://example.com/streams
# network_web_reg    https://example.com/register

# ── 管理 UI / API ─────────────────────────────────────────────
admin_enable true
admin_bind 127.0.0.1
admin_port 18080
# ループバック限定なので認証なし。0.0.0.0 にする場合は必ず admin_user/password を設定する
# admin_user admin
# admin_password s3cret

# ── マウントポイント ──────────────────────────────────────────
# rtk.toiso.fit:2101 の eniwa-bd982 を中継するための受け皿
# 認証なしのオープンマウントとして公開する
/eniwa-bd982
