# conf/rtk2go-hiroshima.conf — FKP runtime 実地テスト用
#
# rtk2go.com の広島近郊 3 局を上流に取り、FKP_HIROSHIMA という仮想 mountpoint
# として配信する設定。caster 単体で「3 局接続 → MSM7 抽出 → FKP 算出 → Type59
# 注入」のフルパイプラインが回ることを確認する用途。
#
# 使い方:
#   docker run --rm --platform linux/arm64 \
#     -v "$PWD":/work -v zig-cache-v:/root/.cache/zig \
#     -p 12101:12101 -p 18080:18080 \
#     ntripcaster-zig:0.15.2 \
#     sh -c "cd /work && zig build && ./zig-out/bin/ntripcaster -c conf/rtk2go-hiroshima.conf"
#
# 別ターミナルで:
#   nc localhost 12101 < /dev/null            # SOURCETABLE
#   curl -s localhost:12101/FKP_HIROSHIMA | head -c 200 | xxd
#   open http://localhost:18080/              # 管理 UI

# ── ネットワーク ──────────────────────────────────────────────
port 12101
server_name localhost
location demo
rp_email noreply@example.com

max_clients 20
max_clients_per_source 20
max_sources 8

# caster 内の SOURCE 接続用パスワード (rtk2go は別の上流なのでここは未使用)
encoder_password localpass

logdir logs
logfile ntripcaster.log

# ── 管理 UI ──────────────────────────────────────────────────
admin_enable true
admin_bind 127.0.0.1
admin_port 18080

# ── FKP runtime ──────────────────────────────────────────────
# rtk2go.com は無認証クライアントに対し "Authorization: Basic" の値が
# 何でも通る (慣例的に user@example.com / none で接続)。
fkp_enable true
fkp_source rtk2go.com:2101/JP_AkiGion_HS bb.folf@gmail.com:none
fkp_source rtk2go.com:2101/Kabe_oy       bb.folf@gmail.com:none
fkp_source rtk2go.com:2101/noushin-RTK   bb.folf@gmail.com:none
fkp_mountpoint FKP_HIROSHIMA
fkp_interval 1

# rtk2go.com の SNIP caster は NMEA=1 (GGA 必須) として広告するので、
# GET 直後に合成 GGA を送って RTCM3 配信を開かせる。FKP 用なので位置は
# クラスタ中心付近で OK (rover の実位置ではない)。
fkp_gga_lat 34.50
fkp_gga_lon 132.65

# ── VRS ──────────────────────────────────────────────────────────────
# rover が GGA を送ることを前提とした Network RTK サービス。FKP runtime の
# 仮想 mountpoint を主上流として使い、rover 位置の Type 1005 を注入する。
# (Phase 4 段階では MSM7 補正はまだ未実装、Phase 5 で対応予定)
vrs_enable true
vrs_mountpoint /VRS_HIROSHIMA
vrs_cell_center_lat 34.50
vrs_cell_center_lon 132.65
vrs_cell_radius_km 80

# ── マウントポイント ──────────────────────────────────────────
# 仮想 FKP_HIROSHIMA は FKP runtime が自動登録するので、ここに書く必要なし。
# 通常の SOURCE 受け皿が要るならここに足す。
