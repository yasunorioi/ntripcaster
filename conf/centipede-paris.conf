# conf/centipede-paris.conf — VRS Phase 4 診断テスト用 (rtk2go レート制限回避)
#
# Centipede RTK (caster.centipede.fr) は INRAE 運営の無料 NTRIP ネットワーク。
# NMEA 不要 / 無認証で接続可能で、レート制限が緩い。
#
# Paris 周辺の 3 局を triangle として FKP_PARIS 仮想 mountpoint で配信し、
# /VRS_PARIS に rover を繋いで Phase 4 の診断ログ (first GGA / first inject
# 1005 / 5s stats) を確認する。
#
# 使い方:
#   docker run --rm --platform linux/arm64 \
#     -v "$PWD":/work -v zig-cache-v:/root/.cache/zig \
#     -p 12101:12101 -p 18080:18080 \
#     ntripcaster-zig:0.15.2 \
#     sh -c "cd /work && zig build && ./zig-out/bin/ntripcaster -c conf/centipede-paris.conf"
#
#   別シェルで str2str:
#     str2str \
#       -in "ntrip://localhost:12101/VRS_PARIS#rtcm3" \
#       -out file:///tmp/vrs_paris.bin \
#       -p 48.72 2.28 50 -n 5000

# ── ネットワーク ──────────────────────────────────────────────
port 12101
server_name localhost
location demo
rp_email noreply@example.com

max_clients 20
max_clients_per_source 20
max_sources 8

encoder_password localpass

logdir logs
logfile ntripcaster.log

# ── 管理 UI ──────────────────────────────────────────────────
admin_enable true
admin_bind 127.0.0.1
admin_port 18080

# ── FKP runtime (Paris triangle) ─────────────────────────────
# CROI (48.689, 1.503) — Croisilles 西
# IPGP (48.845, 2.356) — Paris 中心
# SGC  (48.625, 2.969) — Saint-Germain Centipede 東
fkp_enable true
fkp_source caster.centipede.fr:2101/CROI
fkp_source caster.centipede.fr:2101/IPGP
fkp_source caster.centipede.fr:2101/SGC
fkp_mountpoint FKP_PARIS
fkp_interval 1

# centipede は NMEA 不要なので gga_lat/lon は 0 のままで OK
# (0 を指定すると upstream.zig が GGA 送信をスキップする)
fkp_gga_lat 0.0
fkp_gga_lon 0.0

# ── VRS (Paris) ───────────────────────────────────────────────
vrs_enable true
vrs_mountpoint /VRS_PARIS
vrs_cell_center_lat 48.72
vrs_cell_center_lon 2.28
vrs_cell_radius_km 80
